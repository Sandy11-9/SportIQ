spring:
  application:
    name: sportiq-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sportiq
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    ollama:
      base-url: http://localhost:11434
  mail:
    # Set credentials through environment variables; never commit real secrets.
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    from: ${SPRING_MAIL_FROM:noreply@localhost}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

sportiq:
  jwt:
    # Required outside tests. Generate a strong secret and provide SPORTIQ_JWT_SECRET.
    secret: ${SPORTIQ_JWT_SECRET:}
    expiration-ms: 86400000
  ai:
    vision-model: moondream
    reasoning-model: phi4-mini
    chat-timeout-ms: 60000
    budget-ms: 600000
  otp:
    length: 6
    ttl-seconds: 600
    resend-cooldown-seconds: 30
  media:
    temp-dir: uploads
    temp-max-age-hours: 1
    min-duration-seconds: 5
    max-duration-seconds: 20
    frames-per-second: 1.5
    max-file-size-bytes: 52428800
    allowed-content-types: video/mp4, video/quicktime, video/x-m4v, video/webm, video/x-matroska
  ffmpeg:
    binary: ffmpeg
    ffprobe-binary: ffprobe
