name: SportIQ Runtime Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportiq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL + FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install FFmpeg for media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run backend test suite
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Run Angular unit tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

  compose-runtime-smoke:
    name: Docker Compose runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend-tests, frontend]
    env:
      # Ephemeral CI-only value. Never use this outside automated tests.
      SPORTIQ_JWT_SECRET: sportiq-ci-only-secret-not-for-deployment-0123456789
      SPRING_MAIL_USERNAME: ''
      SPRING_MAIL_PASSWORD: ''
      SPRING_MAIL_FROM: noreply@localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start containers and smoke-test app plus API proxy
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f docker-compose.yml -f docker-compose.ci.yml)
          cleanup() {
            "${compose[@]}" logs --no-color --tail=150 backend frontend postgres ollama ollama-setup || true
            "${compose[@]}" down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          "${compose[@]}" up --build -d

          backend_status=""
          for attempt in $(seq 1 90); do
            backend_status="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/sports || true)"
            if [ "$backend_status" = "401" ]; then
              break
            fi
            sleep 5
          done

          if [ "$backend_status" != "401" ]; then
            echo "Backend did not reach the expected protected-endpoint response (HTTP 401); got: $backend_status"
            "${compose[@]}" ps -a
            exit 1
          fi

          curl --fail --silent --show-error http://localhost:4200/ -o /dev/null

          proxy_status="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:4200/api/sports || true)"
          if [ "$proxy_status" != "401" ]; then
            echo "Frontend Nginx API proxy expected HTTP 401, got: $proxy_status"
            exit 1
          fi

          echo "Compose runtime smoke passed: backend started, frontend returned HTTP 200, API proxy reached the protected backend."
