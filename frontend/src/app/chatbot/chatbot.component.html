@if (open()) {
  <section class="chat-panel" role="dialog" aria-label="SportIQ Assistant">
    <header class="chat-header">
      <span class="chat-brand">
        <span class="brand-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        </span>
        SportIQ Assistant
      </span>
      <div class="chat-actions">
        <button type="button" class="icon-button" (click)="minimize()" aria-label="Minimize">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" class="icon-button" (click)="minimize()" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-messages" #messagesEl>
      @for (msg of messages(); track $index) {
        <div class="bubble-row" [class.user-row]="msg.role === 'user'">
          <div
            class="bubble"
            [class.user-bubble]="msg.role === 'user'"
            [class.assistant-bubble]="msg.role === 'assistant'"
          >{{ msg.content }}</div>
        </div>
      }
      @if (waiting()) {
        <div class="bubble-row">
          <div class="bubble assistant-bubble typing" role="status">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="sr-only">Thinking…</span>
          </div>
        </div>
      }
    </div>

    <footer class="chat-footer">
      @if (error(); as message) {
        <p class="chat-error">{{ message }}</p>
      }
      <div class="chat-input-row">
        <textarea
          [value]="draft()"
          (input)="onInput($event)"
          (keydown)="onKeydown($event)"
          [attr.maxlength]="maxLength"
          rows="1"
          placeholder="Ask about sports…"
          aria-label="Message"
        ></textarea>
        <button type="button" class="send-button" (click)="send()" [disabled]="waiting()" aria-label="Send">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
      <div class="chat-meta">
        <span>{{ draft().length }}/2000</span>
        <span>Enter to send · Shift+Enter for a new line</span>
      </div>
    </footer>
  </section>
}

<button
  type="button"
  class="chat-fab"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  aria-label="SportIQ Assistant"
>
  @if (open()) {
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
  }
</button>
